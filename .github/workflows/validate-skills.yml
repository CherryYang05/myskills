name: Validate Skills

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Test safety and synchronization logic
        run: python3 -m unittest discover -s automation/tests -v
      - name: Validate Skill inventory and external source registry
        run: python3 automation/scripts/verify.py
      - name: Verify Skill revision logs
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            base=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
          fi
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            python3 automation/scripts/skill_changelog.py
          else
            python3 automation/scripts/skill_changelog.py --base "$base"
          fi
      - name: Validate source configuration
        run: python3 automation/scripts/sync.py --check-config
      - name: Static safety and license review of imported Skills
        run: python3 automation/scripts/review_imports.py
      - name: Validate semantic icon coverage, colors and SVG safety
        run: python3 automation/scripts/verify_appearance.py
      - name: Verify generated README, Marketplace and Plugin packages
        run: python3 automation/scripts/generate.py --check
      - name: Check Python syntax
        run: python3 -m compileall -q automation/scripts automation/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify blog figures survive ByteMD HTML sanitization
        working-directory: automation/html-tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Verify Skills CLI discovers all source Skills
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npx --yes skills@latest add . --list | tee "$RUNNER_TEMP/skills-cli-list.txt"
          python3 automation/scripts/check_cli_inventory.py "$RUNNER_TEMP/skills-cli-list.txt"
      - name: Validate Claude Code plugin marketplace
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate .
      - name: Smoke-test Skills CLI installation for Claude Code and Cursor
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skills-install-smoke"
          cd "$RUNNER_TEMP/skills-install-smoke"
          printf '{"private":true}\n' > package.json
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --skill humanizer -a claude-code -a cursor --copy -y
          test -f .agents/skills/humanizer/SKILL.md
          cmp "$GITHUB_WORKSPACE/skills/external/humanizer/SKILL.md" .agents/skills/humanizer/SKILL.md

