name: Validate Skills

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Check marketplace covers all skill packages
        run: python3 skill-sync/scripts/gen_marketplace.py --check
      - name: Validate upstream configuration
        run: python3 skill-sync/scripts/sync_upstream.py --validate-config
      - name: Test upstream update safeguards
        run: python3 -m unittest discover -s skill-sync/tests -v
      - name: Validate source/version mapping
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location("gen_readme", root / "skill-sync/scripts/gen_readme.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          skills = set(module.skill_dirs(root))
          sources = module.EXTERNAL_SOURCES
          assert set(sources) <= skills, f"Orphaned external sources: {set(sources) - skills}"
          for name, info in sources.items():
              assert info["url"].startswith("https://github.com/"), name
              assert info["version"] and info["version"].lower() not in {"latest", "main", "master", "head"}, name
              assert (root / name / "SKILL.md").is_file(), name
          print(f"Validated {len(skills)} skills, {len(sources)} external source records")
          PY
      - name: Validate external SKILL.md frontmatter
        run: python3 skill-sync/scripts/validate_external_skills.py
      - name: Check README generation is reproducible
        run: |
          python3 skill-sync/scripts/gen_readme.py
          git diff --exit-code -- README.md
      - name: Reject tracked runtime artifacts
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import PurePosixPath

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0")
          forbidden = [
              path for path in tracked if path and (
                  "__pycache__" in PurePosixPath(path).parts
                  or ".pytest_cache" in PurePosixPath(path).parts
                  or "node_modules" in PurePosixPath(path).parts
                  or path.endswith((".pyc", ".pyo"))
                  or PurePosixPath(path).name == ".DS_Store"
              )
          ]
          if forbidden:
              raise SystemExit("Runtime artifacts are tracked:\n" + "\n".join(forbidden))
          PY

      - name: Check Python syntax
        run: python3 -m compileall -q skill-sync/scripts skill-creator/scripts
