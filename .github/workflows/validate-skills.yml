name: Validate Skills

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Test safety and synchronization logic
        run: python3 -m unittest discover -s automation/tests -v
      - name: Validate Skill inventory and external source registry
        run: python3 automation/scripts/verify.py
      - name: Validate source configuration
        run: python3 automation/scripts/sync.py --check-config
      - name: Verify generated README and ChatGPT marketplace
        run: python3 automation/scripts/generate.py --check
      - name: Check Python syntax
        run: python3 -m compileall -q automation/scripts automation/tests
