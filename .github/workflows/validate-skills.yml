name: Validate Skills

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate source/version mapping
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location("gen_readme", root / "skill-sync/scripts/gen_readme.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          skills = set(module.skill_dirs(root))
          sources = module.EXTERNAL_SOURCES
          assert set(sources) <= skills, f"Orphaned external sources: {set(sources) - skills}"
          for name, info in sources.items():
              assert info["url"].startswith("https://github.com/"), name
              assert info["version"] and info["version"].lower() not in {"latest", "main", "master", "head"}, name
              assert (root / name / "SKILL.md").is_file(), name
          print(f"Validated {len(skills)} skills, {len(sources)} external source records")
          PY
      - name: Validate external SKILL.md frontmatter
        run: |
          python skill-creator/scripts/quick_validate.py deep-research
          python skill-creator/scripts/quick_validate.py humanizer
          python skill-creator/scripts/quick_validate.py skill-creator
      - name: Check README generation is reproducible
        run: |
          python3 skill-sync/scripts/gen_readme.py
          git diff --exit-code -- README.md
      - name: Check Python syntax
        run: python3 -m compileall -q skill-sync/scripts skill-creator/scripts
