name: Sync Skill Upstreams

on:
  push:
    branches: [master]
    paths:
      - 'automation/upstreams.json'
      - 'automation/plugin-appearance.json'
      - 'automation/plugin-groups.json'
      - 'automation/scripts/sync.py'
      - 'automation/scripts/review_imports.py'
      - '.github/workflows/sync-upstream.yml'
  schedule:
    - cron: '30 12 * * 5' # Friday 20:30 Asia/Shanghai
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: Check without modifying or merging
        default: false
  pull_request:
    paths:
      - '.github/workflows/sync-upstream.yml'
      - 'automation/scripts/sync.py'
      - 'automation/scripts/auto_merge.py'
      - 'automation/scripts/plugin_groups.py'
      - 'automation/plugin-groups.json'
      - 'automation/upstreams.json'
      - 'automation/tests/**'

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'pull_request' || inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect registered sources (no writes)
        run: python3 automation/scripts/sync.py --report-json "$RUNNER_TEMP/upstream-check.json"
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-preview
          path: ${{ runner.temp }}/upstream-check.json

  sync:
    if: github.event_name != 'pull_request' && inputs.dry_run != true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Test trusted sync code
        run: python3 -m unittest discover -s automation/tests -v
      - name: Fetch all upstreams and prepare candidate
        run: |
          python3 automation/scripts/sync.py --apply --report-json "$RUNNER_TEMP/upstream-check.json"
          python3 automation/scripts/verify.py
          python3 automation/scripts/review_imports.py
          python3 automation/scripts/verify_appearance.py
          python3 automation/scripts/generate.py
          python3 automation/scripts/generate.py --check
      - name: Stage exclusively managed Skill packages and generated outputs
        run: |
          git add -A -- skills/external plugins automation/upstreams.json README.md UPSTREAM_SYNC_REPORT.md .agents/plugins/marketplace.json .claude-plugin/marketplace.json .cursor-plugin/marketplace.json skills.sh.json
      - name: Create candidate PR, exact-commit validate, and merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'No changes to sync this period.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base_sha=$(git rev-parse HEAD)
          digest=$(git diff --cached --binary | sha256sum | cut -c1-16)
          branch="automation/upstream-${base_sha:0:12}-$digest"
          existing=$(gh pr list --repo "$REPOSITORY" --state all --head "$branch" --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            state=$(gh pr view "$existing" --repo "$REPOSITORY" --json state --jq '.state')
            if [ "$state" = OPEN ]; then
              git fetch origin "$branch"
              test "$(git write-tree)" = "$(git rev-parse 'FETCH_HEAD^{tree}')"
              head_sha=$(git rev-parse FETCH_HEAD)
              number=$(gh pr view "$existing" --repo "$REPOSITORY" --json number --jq '.number')
              python3 automation/scripts/auto_merge.py --pr "$number" --branch "$branch" --head "$head_sha" --base-sha "$base_sha"
            else
              echo "Candidate already $state: $existing" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          git switch -c "$branch"
          git -c core.hooksPath=/dev/null -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(sync): update upstream Skill packages and report'
          if [ -n "$(git ls-remote --heads origin "$branch")" ]; then
            git fetch origin "$branch"
            test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          pr_url=$(gh pr create --repo "$REPOSITORY" --base "$BASE_BRANCH" --head "$branch" --title 'chore(sync): update external Skills and report' --body "Generated by $RUN_URL. Auto-merge requires successful exact-head CI and unmodified source configuration.")
          echo "$pr_url" >> "$GITHUB_STEP_SUMMARY"
          number=$(gh pr view "$pr_url" --repo "$REPOSITORY" --json number --jq '.number')
          python3 automation/scripts/auto_merge.py --pr "$number" --branch "$branch" --head "$(git rev-parse HEAD)" --base-sha "$base_sha"
      - name: Report failed synchronization
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title='[sync] Upstream synchronization requires repair'
          existing=$(gh issue list --repo "$REPOSITORY" --state open --limit 100 --json title,number --jq '.[] | select(.title == "[sync] Upstream synchronization requires repair") | .number' | head -n1 || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPOSITORY" --body "Failed upstream sync: $RUN_URL; candidate (if any) was not merged. Investigate workflow logs." || true
          else
            gh issue create --repo "$REPOSITORY" --title "$title" --body "Automatic upstream sync failed: $RUN_URL. Nothing is considered synchronized until the candidate passes CI and merges." || true
          fi
      - name: Resolve prior synchronization alert after successful run
        if: success()
        continue-on-error: true # Notification cleanup must not invalidate a successful sync.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$REPOSITORY" --state open --limit 100 --json title,number --jq '.[] | select(.title == "[sync] Upstream synchronization requires repair") | .number' | head -n1 || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPOSITORY" --body "Recovered: subsequent upstream sync completed successfully: $RUN_URL."
            gh issue close "$number" --repo "$REPOSITORY" --reason completed
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-check
          path: ${{ runner.temp }}/upstream-check.json
          if-no-files-found: ignore
