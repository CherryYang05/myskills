name: Record Actions runs

on:
  workflow_run:
    workflows: [Sync Skill Upstreams, Validate Skills]
    types: [completed]
  push:
    branches: [master]
    paths:
      - '.github/workflows/action-run-log.yml'
      - 'automation/scripts/action_run_log.py'
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write

concurrency:
  group: action-run-log-writer
  cancel-in-progress: false

jobs:
  record:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: source
          persist-credentials: false
          sparse-checkout: |
            automation/scripts
            .github/workflows
      - uses: actions/checkout@v4
        with:
          ref: action-logs
          path: journal
          sparse-checkout: logs/actions
      - name: Read completed attempts and reconcile missed events
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 source/automation/scripts/action_run_log.py journal/logs/actions
      - name: Save monthly logs
        working-directory: journal
        run: |
          git add -- logs/actions
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record completed Actions attempts'
            git push origin HEAD:refs/heads/action-logs
          fi
